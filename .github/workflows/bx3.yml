# <org>/.github/.github/workflows/autopilot.yml
# 組織共通の再利用ワークフロー。各プロダクトの薄い autopilot.yml から呼ばれる。
name: bx3-no-concurrency

on:
  workflow_call:
    inputs:
      issue_number: { required: true,  type: number }
      issue_body:   { required: true,  type: string }
      project_name: { required: true,  type: string }
      node_version: { required: false, type: string, default: '22' }

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30



    steps:
      - run: echo bx2
