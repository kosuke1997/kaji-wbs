# 各プロダクト側の薄いファイル。実体は kosuke1997/.github の再利用ワークフロー。
#
# 直列版と並列版を切り替えられる。**既定は直列。**
#   gh variable set AUTOPILOT_MODE --body parallel
#   gh variable set AUTOPILOT_MODE --body serial     （既定）
#
# 並列に切り替えてよいのは、直列で回して**性能の劣化が実証された場合だけ**。
# マルチエージェントは同じ仕事に3〜10倍のトークンを使う。
# 速そうだから、という理由で切り替えると調整コストだけが乗る。
#
# 切り替える根拠になるのは次のどれか:
#   - 1回の実行がコンテキスト上限に当たるようになった
#   - 同時に動ける「読むだけの役」が2つ以上ある Issue が常態化した
#   - 特定の役だけ別の判断根拠（legal-policy 等）を要する場面が増えた
#
# 根拠: docs/MULTI-AGENT-RESEARCH.md
name: Feedback Autopilot

on:
  issues:
    types: [opened, labeled]

jobs:
  # 無限ループ防止:
  # labeled を拾うと、エージェント自身が優先度ラベルを付けた瞬間に再発火する。
  # bot 自身のアクションを除外し、ラベル名を feedback に限定する。
  serial:
    if: >
      github.actor != 'github-actions[bot]' &&
      vars.AUTOPILOT_MODE != 'parallel' &&
      ( github.event.action == 'opened' ||
        (github.event.action == 'labeled' && github.event.label.name == 'feedback') )
    # 再利用ワークフローの permissions は「絞る」ことしかできない。
    # 呼び出し側がここで権限を宣言していないと、呼び先が contents: write 等を
    # 要求した時点で startup_failure になる（ジョブが1つも始まらない）。
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write # 呼び先の claude-code-action が OIDC に使う
    uses: kosuke1997/.github/.github/workflows/autopilot.yml@main
    with:
      issue_number: ${{ github.event.issue.number }}
      issue_body: ${{ github.event.issue.body }}
      project_name: kaji-wbs
    secrets: inherit

  parallel:
    if: >
      github.actor != 'github-actions[bot]' &&
      vars.AUTOPILOT_MODE == 'parallel' &&
      ( github.event.action == 'opened' ||
        (github.event.action == 'labeled' && github.event.label.name == 'feedback') )
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    uses: kosuke1997/.github/.github/workflows/autopilot-parallel.yml@main
    with:
      issue_number: ${{ github.event.issue.number }}
      issue_body: ${{ github.event.issue.body }}
      project_name: kaji-wbs
    secrets: inherit
