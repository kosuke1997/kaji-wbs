name: bx5-concurrency-only

on:
  workflow_call:
    inputs:
      issue_number: { required: true,  type: number }
      issue_body:   { required: true,  type: string }
      project_name: { required: true,  type: string }

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: autopilot-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - run: echo bx5-concurrency-only
